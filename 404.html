<style>
  /* Same root violet as Home — this page isn't part of any one case
     study, so it takes the site's default accent rather than borrowing
     a case-study hue that would misleadingly suggest it belongs to one. */
  :root { --accent: #563174; --accent-soft: #F0ECF3; }

  .nf-code {
    font-family: "Raleway", sans-serif; font-weight: 700;
    font-size: clamp(3.5rem, 9vw, 5.5rem); line-height: 1;
    letter-spacing: -0.03em; color: var(--line-2);
    -webkit-text-stroke: 1.5px var(--accent);
    color: transparent;
  }

  /* Full-height hero so the footer lands right at the bottom of the first
     screen instead of stranded in a gap of dead space below a short block
     of content. --nav-h is measured live by motion.js; 68px is just the
     pre-JS fallback. */
  .hero { min-height: calc(80vh - var(--nav-h, 68px)); display: flex; align-items: center; padding-top: 40px; padding-bottom: 40px; }
  @media (max-width: 700px) { .hero { min-height: 0; padding-top: 56px; padding-bottom: 56px; } }

  /* No card this time: image sits directly on the page canvas. Its own
     background is plain white, same as --canvas, so dropping the border/
     shadow/padding is enough to read as "no box" without needing a
     transparent asset. */
  .nf-illo { max-width: 460px; margin: 0 auto; }
  .nf-illo img { width: 100%; height: auto; display: block; }
</style>
</head>
